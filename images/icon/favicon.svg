  <!-- Corner accents -->
  <circle cx="16" cy="6.5" r="1" fill="#4A9EFF" opacity="0.5"/>
  <circle cx="25.5" cy="16" r="1" fill="#4A9EFF" opacity="0.5"/>
  <circle cx="16" cy="25.5" r="1" fill="#4A9EFF" opacity="0.5"/>
  <circle cx="6.5" cy="16" r="1" fill="#4A9EFF" opacity="0.5"/>
</svg>
