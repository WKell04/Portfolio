let aktuelleSeite = 'resume';

function seiteWechseln(name, ohneHash) {
  if (name === aktuelleSeite) return;
  aktuelleSeite = name;

  if (!ohneHash) window.location.hash = name;

  const inhalt = document.getElementById('seiteninhalt');

  // Ausblenden
  inhalt.classList.add('ausblenden');

  setTimeout(() => {
    // Inhalt wechseln
    inhalt.innerHTML = seiten[name] || '';
    window.scrollTo({ top: 0 });

    // Einblenden
    inhalt.classList.remove('ausblenden');

    // Aktiven Nav-Link markieren
    document.querySelectorAll('.nav-link').forEach(link => {
      const istAktiv = link.dataset.seite === name;
      link.classList.toggle('border-b-2', istAktiv);
      link.classList.toggle('pb-1', istAktiv);
      link.classList.toggle('font-bold', istAktiv);
      link.classList.toggle('text-white', istAktiv);
      link.classList.toggle('text-white/80', !istAktiv);
    });

    // Block-Animationen starten
    setTimeout(() => {
      document.querySelectorAll('.bg-surface-container-lowest').forEach((block, i) => {
        setTimeout(() => block.classList.add('sichtbar'), i * 150);
      });
    }, 50);

    // Projektkarten: Klick-Feedback
    document.querySelectorAll('.group').forEach(card => {
      card.addEventListener('click', () => {
        card.style.transform = 'scale(0.98)';
        setTimeout(() => { card.style.transform = ''; }, 150);
      });
    });
  }, 250);
}

// Nav-Links verdrahten
document.querySelectorAll('.nav-link').forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();
    seiteWechseln(link.dataset.seite);
  });
});

// Startseite laden (Hash auslesen oder resume als Standard)
const startSeite = window.location.hash.replace('#', '') || 'resume';
const gueltigeSeiten = Object.keys(seiten);
const seiteZuLaden = gueltigeSeiten.includes(startSeite) ? startSeite : 'resume';

aktuelleSeite = seiteZuLaden;
if (!window.location.hash) window.location.hash = seiteZuLaden;

inhalt = document.getElementById('seiteninhalt');
inhalt.innerHTML = seiten[seiteZuLaden];
document.querySelector('[data-seite="' + seiteZuLaden + '"]').classList.add('border-b-2', 'pb-1', 'font-bold', 'text-white');
document.querySelector('[data-seite="' + seiteZuLaden + '"]').classList.remove('text-white/80');
setTimeout(() => {
  document.querySelectorAll('.bg-surface-container-lowest').forEach((block, i) => {
    setTimeout(() => block.classList.add('sichtbar'), i * 150);
  });
}, 100);

// Scroll-Effekt für Header
window.addEventListener('scroll', () => {
  const header = document.querySelector('header');
  header.classList.toggle('shadow-md', window.scrollY > 20);
});
</script>
